<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#040711" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 12" />

  <!-- Main Glowing Target Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#primaryGrad)" stroke-width="8" filter="url(#glow)" opacity="0.9" />

  <!-- Middle Concentric Ring -->
  <circle cx="256" cy="256" r="105" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="20 10" opacity="0.6" />

  <!-- Crosshair Marks -->
  <line x1="256" y1="56" x2="256" y2="106" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="406" x2="256" y2="456" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />
  <line x1="56" y1="256" x2="106" y2="256" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />
  <line x1="406" y1="256" x2="456" y2="256" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />

  <!-- Central Dynamic Reflex Lightning Bolt -->
  <path d="M280 120 L180 270 L250 270 L230 392 L340 236 L270 236 Z" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- Center Energy Core Accent -->
  <circle cx="256" cy="256" r="18" fill="#ffffff" opacity="0.3" filter="url(#glow)" />
</svg>
